bundle:
  name: week1-homework

resources:
  apps:
    week1_homework:
      name: week1-homework
      description: >-
        Closed-loop AI feedback app sourced from
        https://github.com/srinivas-malyala/closed-loop-ai-feedback.
      git_repository:
        provider: gitHub
        url: https://github.com/srinivas-malyala/closed-loop-ai-feedback
      git_source:
        branch: main
        source_code_path: .
      lifecycle:
        started: true
      resources:
        - name: lakebase-url
          description: Lakebase connection URL used by the application.
          secret:
            scope: database
            key: lakebase-url
            permission: READ
        - name: token
          description: Optional GitHub API token used by the application.
          secret:
            scope: github
            key: token
            permission: READ

  jobs:
    generate_repo_scd_on_change:
      name: "Generate Repo SCD (triggered by lb_github_repos_history)"
      description: >
        Triggered automatically when lb_github_repos_history receives changes.
        Waits 60 seconds after the last change before running, to batch
        rapid successive updates into a single processing run.

      trigger:
        table_update:
          condition: ALL_UPDATED
          table_names:
            - "bootcamp_student.sri.lb_github_repos_history"
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 60

      tasks:
        - task_key: generate_repo_scd
          notebook_task:
            notebook_path: ./notebooks/day1_ingest/generate_repo_scd.py
            base_parameters:
              catalog: "bootcamp"
              schema: "ltap_lab_day1"

    github_graph_traversal_on_feedback:
      name: "GitHub Graph Traversal (triggered by AI feedback)"
      description: >
        Runs graph traversal after the AI suggestion feedback history table is
        updated. Waits 60 seconds after the latest change to batch rapid
        feedback submissions into a single processing run.

      trigger:
        pause_status: UNPAUSED
        table_update:
          condition: ANY_UPDATED
          table_names:
            - "bootcamp_students.sri.lb_ai_suggestion_feedback_history"
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 60

      tasks:
        - task_key: github_graph_traversal
          notebook_task:
            notebook_path: "./notebooks/day2_processing/github graph traversal.py"
            base_parameters:
              catalog: "bootcamp_students"
              schema: "sri"
              target_repos: "500"
              max_hops: "3"
              fetch_mode: "graphql"

targets:
  prod:
    default: true
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
