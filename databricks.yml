# Databricks Asset Bundle configuration
# See https://docs.databricks.com/dev-tools/bundles/index.html

bundle:
  name: ltap-lab-day1

resources:
  jobs:
    process_repo_insights_on_change:
      name: "Process Repo Insights (triggered by lb_github_repos_history)"
      description: >
        Triggered automatically when lb_github_repos_history receives changes.
        Waits 60 seconds after the last change before running, to batch
        rapid successive updates into a single processing run.

      trigger:
        table_update:
          condition: ALL_UPDATED
          table_names:
            - "main.ltap_lab_day1.lb_github_repos_history"
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 60

      tasks:
        - task_key: generate_repo_scd
          notebook_task:
            notebook_path: ./notebooks/day1_ingest/generate_repo_scd.py
            base_parameters:
              catalog: "main"
              schema: "ltap_lab_day1"
          existing_cluster_id: ${var.cluster_id}

      queue:
        enabled: true

variables:
  cluster_id:
    description: "The cluster ID to run the workflow on"
    default: ""
